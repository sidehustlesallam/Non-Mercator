<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Non-Mercator — Seven Ways to See the World</title>
    <meta
      name="description"
      content="An interactive world atlas that lets you switch between Mercator and six alternative map projections, then re-center the globe on any country."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230c1218' stroke='%23c9a227' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='6' ry='14' fill='none' stroke='%237a9e8e' stroke-width='1.2'/%3E%3Cpath d='M2 16h28M16 2c4 5 6 10 6 14s-2 9-6 14c-4-5-6-10-6-14s2-9 6-14z' fill='none' stroke='%237a9e8e' stroke-width='1'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Non-Mercator</h1>
            <p class="tagline">Seven projections. One planet. Honest scale.</p>
          </div>
        </div>
        <p class="projection-meta" id="projection-meta"></p>
      </header>

      <aside class="panel panel-controls" id="controls-root" aria-label="Map controls"></aside>

      <main class="map-stage" id="map" aria-label="Interactive world map"></main>

      <aside class="panel panel-sidebar" id="sidebar-root" hidden></aside>

      <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
